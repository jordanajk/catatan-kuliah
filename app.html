<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Kuliah</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Simpan semua materi kuliah, pelajari ulang, dan ubah jadi kuis.">
  <meta name="theme-color" content="#2f6f5e">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></symbol>

      <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></symbol>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
      <a href="index.html" class="brand" title="Ke halaman depan">
        <span class="logo-mark"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg></span>
        <span>Catatan Kuliah</span>
      </a>
      <nav class="nav-main">
        <a href="#/" data-nav="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg> Beranda</a>
        <a href="#/kuis" data-nav="kuis"><svg class="ic" aria-hidden="true"><use href="#i-quiz"/></svg> Kuis &amp; Flashcard</a>
        <a href="#/pengaturan" data-nav="pengaturan"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg> Backup &amp; Pengaturan</a>
      </nav>
      <div class="side-head">
        <span>Mata kuliah</span>
        <button class="icon-btn xs" id="addCourseBtn" aria-label="Tambah mata kuliah" title="Tambah mata kuliah"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
      </div>
      <div class="course-list" id="courseList"></div>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Buka menu"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <form class="search" id="searchForm" role="search">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="search" id="searchInput" placeholder="Cari materi…" aria-label="Cari materi" autocomplete="off">
          <kbd>/</kbd>
        </form>
        <a class="btn primary" href="#/catatan/baru"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span class="hide-sm">Catatan baru</span></a>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="core.js"></script>
  <script src="app.js"></script>

</html>
